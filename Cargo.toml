[package]
name = "diolingo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
gtk4 = { version = "0.11.4", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.1", features = ["json"] }
